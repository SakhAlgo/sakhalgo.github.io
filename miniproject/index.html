<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" /> -->
    <link rel="stylesheet" href="style/bootstrap.min.css" />
    <link rel="stylesheet" href="style/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>MiniProject</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-xxl-5">
          <div class="goods_box" id="goods">
            <div class="menu">
              <input type="text" class="search" placeholder="Поиск..." />
              <button
                type="button"
                class="add btn-success"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                &#10010;
              </button>
            </div>
            <div class="table-responsive">
              <table class="goods table mt-3" id="table1">
                <thead>
                  <tr class="table-primary align-items">
                    <th data-type="number">№</th>
                    <th data-type="string">Название</th>
                    <th data-type="number">Цена, &#8381;</th>
                    <th data-type="number">Количество</th>
                    <th></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody class="list"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-xs-12 col-xxl-7">
          <div class="price_box">
            <div class="menu">
              <div class="price_title">
                Итого:
                <span class="price_result">0 &#8381;</span>
              </div>
            </div>
            <div class="table-responsive">
              <table class="price table mt-3" id="table2">
                <thead>
                  <tr class="table-primary align-middle">
                    <th data-type="number">№</th>
                    <th data-type="string">Название</th>
                    <th data-type="number">Цена/шт, &#8381;</th>
                    <th data-type="number">Количество</th>
                    <th data-type="number">Скидка %</th>
                    <th data-type="number">Цена, &#8381;</th>
                    <th data-type="number"></th>
                  </tr>
                </thead>
                <tbody class="cart"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить товар</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <label for="good_name" class="form-label">Название товара</label>
            <input
              type="text"
              class="form-control mb-3"
              id="good_name"
              maxlength="40"
            />
            <label for="good_price" class="form-label">Цена</label>
            <input
              type="text"
              class="form-control mb-3"
              id="good_price"
              maxlength="40"
            />
            <label for="good_count" class="form-label">Количество</label>
            <input
              type="text"
              class="form-control mb-3"
              id="good_count"
              min="1"
              value="1"
              maxlength="40"
            />
            <button type="submit" class="add_new btn btn-success">Сохранить</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer mt-5 py-4">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-4 text-center text-md-start">
            <img src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo" class="logo img-fluid" style="max-height: 50px;">
          </div>
          <div class="col-md-4 text-center">
            <p class="mb-0">&copy; 2026 MiniProject. Все права защищены.</p>
          </div>
          <div class="col-md-4 text-center text-md-end">
            <a href="#" class="text-decoration-none mx-2">
              <i class="fab fa-twitter fa-2x text-dark"></i>
            </a>
            <a href="#" class="text-decoration-none mx-2">
              <i class="fab fa-github fa-2x text-dark"></i>
            </a>
            <a href="#" class="text-decoration-none mx-2">
              <i class="fab fa-youtube fa-2x text-danger"></i>
            </a>
            <a href="tel:+1234567890" class="text-decoration-none mx-2">
              <i class="fas fa-phone fa-2x text-dark"></i>
            </a>
          </div>
        </div>
      </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/list.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
