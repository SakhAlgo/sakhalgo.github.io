<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест мобильной навигации</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2><span>TKD</span></h2>
            </div>
            <div class="nav-menu" id="nav-menu">
                <div class="belt-navigation">
                    <a href="#yellow-belt" class="nav-link belt-link yellow-belt" data-belt="yellow">🟡 Жёлтый</a>
                    <a href="#green-belt" class="nav-link belt-link green-belt" data-belt="green">🟢 Зелёный</a>
                    <a href="#blue-belt" class="nav-link belt-link blue-belt" data-belt="blue">🔵 Синий</a>
                    <a href="#red-belt" class="nav-link belt-link red-belt" data-belt="red">🔴 Красный</a>
                    <a href="#brown-belt" class="nav-link belt-link brown-belt" data-belt="brown">🟤 Коричневый</a>
                    <a href="#black-belt" class="nav-link belt-link black-belt" data-belt="black">⚫ Чёрный</a>
                </div>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main>
        <section style="padding: 50px 20px; min-height: 200vh;">
            <div class="container">
                <h1>Тест мобильной навигации</h1>
                <p>На мобильных устройствах навигация должна скрываться за гамбургер-меню.</p>
                <p>При нажатии на гамбургер меню должно появляться.</p>
                
                <div style="margin-top: 30px; padding: 20px; background-color: var(--card-bg); border-radius: 8px;">
                    <h2>Тестовый блок</h2>
                    <p>Прокрутите страницу вниз, чтобы проверить поведение навигации.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            const hamburger = document.getElementById('hamburger');
            const navMenu = document.getElementById('nav-menu');

            // Проверяем сохраненную тему или используем темную по умолчанию
            const savedTheme = localStorage.getItem('theme') || 'dark';
            body.setAttribute('data-theme', savedTheme);

            // Обновляем иконку в зависимости от текущей темы
            if (savedTheme === 'dark') {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }

            // Переключение темы
            themeToggle.addEventListener('click', () => {
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';

                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);

                // Обновляем иконку
                if (newTheme === 'dark') {
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                }
            });

            // Мобильное меню
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');

                // Анимация гамбургера
                hamburger.classList.toggle('active');
            });

            // Закрытие меню при клике на ссылку
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    hamburger.classList.remove('active');
                });
            });
        });
    </script>
</body>
</html>
