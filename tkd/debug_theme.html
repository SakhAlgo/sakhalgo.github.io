<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест переключения темы</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2><span>TKD</span></h2>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <section style="padding: 50px 20px;">
            <div class="container">
                <h1>Тест переключения темы</h1>
                <p>Текущая тема: <span id="current-theme">dark</span></p>
                <p>Проверьте, меняется ли тема при нажатии на иконку в навигации.</p>
                
                <div style="margin-top: 30px; padding: 20px; background-color: var(--card-bg); border-radius: 8px;">
                    <h2>Тестовый блок</h2>
                    <p>Цвет этого блока должен изменяться при переключении темы.</p>
                    <p>Текст также должен изменять цвет для лучшей читаемости.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.getElementById('theme-toggle');
            const body = document.body;
            const currentThemeSpan = document.getElementById('current-theme');

            // Проверяем сохраненную тему или используем темную по умолчанию
            const savedTheme = localStorage.getItem('theme') || 'dark';
            body.setAttribute('data-theme', savedTheme);
            currentThemeSpan.textContent = savedTheme;

            // Обновляем иконку в зависимости от текущей темы
            if (savedTheme === 'dark') {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }

            // Переключение темы
            themeToggle.addEventListener('click', () => {
                const currentTheme = body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';

                body.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                currentThemeSpan.textContent = newTheme;

                // Обновляем иконку
                if (newTheme === 'dark') {
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                }
                
                console.log('Theme switched to:', newTheme);
            });
        });
    </script>
</body>
</html>
