<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goods Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Goods Management System</h1>
    </header>

    <div class="main-content">
      <div class="left-panel">
        <div class="panel">
          <h2>Add New Goods</h2>
          <div class="form-group">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" placeholder="Enter product name">
          </div>

          <div class="form-group">
            <label for="productPrice">Price:</label>
            <input type="number" id="productPrice" placeholder="Enter price" min="0" step="0.01">
          </div>

          <div class="form-group">
            <label for="productStock">Stock Quantity:</label>
            <input type="number" id="productStock" placeholder="Enter stock quantity" min="0">
          </div>

          <button id="addProductBtn" class="btn-success">Add Product</button>
        </div>

        <div class="panel">
          <h2>Goods List</h2>
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search goods...">
          </div>
          <table id="goodsTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="goodsList">
              <!-- Goods will be added here dynamically -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="right-panel">
        <div class="panel">
          <h2>Shopping Basket</h2>
          <table id="basketTable">
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Discount (%)</th>
                <th>Total</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="basketList">
              <!-- Basket items will be added here dynamically -->
            </tbody>
          </table>

          <div class="basket-total">
            Total: <span id="totalAmount">0.00</span> $
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
