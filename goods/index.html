<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система управления товарами</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Система управления товарами</h1>
    </header>

    <div class="main-content">
      <div class="left-panel">
        <div class="panel">
          <h2>Добавить новый товар</h2>
          <div class="form-group">
            <label for="productName">Название товара:</label>
            <input type="text" id="productName" placeholder="Введите название товара">
          </div>

          <div class="form-group">
            <label for="productPrice">Цена:</label>
            <input type="number" id="productPrice" placeholder="Введите цену" min="0" step="0.01">
          </div>

          <div class="form-group">
            <label for="productStock">Количество на складе:</label>
            <input type="number" id="productStock" placeholder="Введите количество на складе" min="0">
          </div>

          <button id="addProductBtn" class="btn-success">Добавить товар</button>
        </div>

        <div class="panel">
          <h2>Список товаров</h2>
          <div class="search-container">
            <input type="text" id="searchInput" placeholder="Поиск товаров...">
          </div>
          <table id="goodsTable">
            <thead>
              <tr>
                <th>Название</th>
                <th>Цена</th>
                <th>Склад</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="goodsList">
              <!-- Товары будут добавлены сюда динамически -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="right-panel">
        <div class="panel">
          <h2>Корзина покупок</h2>
          <table id="basketTable">
            <thead>
              <tr>
                <th>Товар</th>
                <th>Цена</th>
                <th>Кол-во</th>
                <th>Скидка (%)</th>
                <th>Всего</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="basketList">
              <!-- Элементы корзины будут добавлены сюда динамически -->
            </tbody>
          </table>

          <div class="basket-total">
            Итого: <span id="totalAmount">0.00</span> руб.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
